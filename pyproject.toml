[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paged-attention-kernel"
version = "0.1.0"
description = "vLLM-Style Block-Paged KV Cache Memory Subsystem, Copy-on-Write Decoding, and PagedAttention Kernel"
readme = "README.md"
authors = [{ name = "SKB-18" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
paged-attn = "cli:main"
